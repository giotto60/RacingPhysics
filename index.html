<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RacingPhysics — Test Environment</title>

  <!-- Three.js via importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js"
    }
  }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;600;800&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #101424;
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
      color: #e0e0f0;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #error-overlay {
      display: none;
      position: fixed;
      inset: 20px;
      z-index: 9999;
      background: rgba(40, 10, 15, 0.95);
      border: 2px solid #ff4444;
      border-radius: 12px;
      padding: 24px;
      color: #ff8888;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
      overflow: auto;
    }

    /* ── HUD ─────────────────────────────────────────── */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      user-select: none;
    }

    /* Speed — top centre */
    #speed-panel {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      background: rgba(15,20,35,0.75);
      border: 1px solid rgba(120,160,255,0.3);
      border-radius: 12px;
      padding: 10px 28px 8px;
      backdrop-filter: blur(8px);
    }
    #speed-value {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 56px;
      line-height: 1;
      color: #a0cfff;
      text-shadow: 0 0 24px rgba(120,180,255,0.5);
    }
    #speed-unit {
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(160,207,255,0.6);
      margin-top: 2px;
    }

    /* Gear — top right */
    #gear-panel {
      position: absolute;
      top: 24px;
      right: 28px;
      background: rgba(15,20,35,0.75);
      border: 1px solid rgba(120,160,255,0.3);
      border-radius: 12px;
      padding: 8px 20px;
      backdrop-filter: blur(8px);
      text-align: center;
    }
    #gear-label { font-size: 10px; letter-spacing: 2px; color: rgba(200,200,255,0.5); }
    #gear-value {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 40px;
      color: #ffe080;
      line-height: 1.1;
      text-shadow: 0 0 16px rgba(255,220,80,0.4);
    }

    /* RPM bar — bottom centre */
    #rpm-panel {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      background: rgba(15,20,35,0.75);
      border: 1px solid rgba(120,160,255,0.2);
      border-radius: 10px;
      padding: 10px 16px;
      backdrop-filter: blur(8px);
    }
    #rpm-label { font-size: 9px; letter-spacing: 2px; color: rgba(200,200,255,0.5); margin-bottom: 5px; }
    #rpm-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    #rpm-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: linear-gradient(90deg, #4080ff, #80c0ff, #ff6060);
      transition: width 0.05s;
    }
    #rpm-value { font-size: 11px; color: rgba(180,200,255,0.7); margin-top: 4px; text-align: right; }

    /* Input bars — bottom left */
    #inputs-panel {
      position: absolute;
      bottom: 32px;
      left: 28px;
      width: 140px;
      background: rgba(15,20,35,0.75);
      border: 1px solid rgba(120,160,255,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
    }
    .input-row { margin-bottom: 8px; }
    .input-row:last-child { margin-bottom: 0; }
    .input-label { font-size: 9px; letter-spacing: 2px; color: rgba(200,200,255,0.5); margin-bottom: 3px; }
    .input-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    #throttle-fill { height:100%; width:0%; border-radius:3px; background:#40c060; }
    #brake-fill    { height:100%; width:0%; border-radius:3px; background:#e05050; }
    #steer-wrap { position:relative; height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
    #steer-fill { position:absolute; top:0; height:100%; background:#a080ff; border-radius:3px; }

    /* Telemetry — bottom right */
    #tele-panel {
      position: absolute;
      bottom: 32px;
      right: 28px;
      width: 220px;
      background: rgba(15,20,35,0.75);
      border: 1px solid rgba(120,160,255,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
      font-size: 10px;
    }
    #tele-panel .tele-header {
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(200,200,255,0.5);
      margin-bottom: 7px;
    }
    .tele-wheel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      color: rgba(200,220,255,0.8);
    }
    .tele-wheel span:first-child { color: rgba(200,200,255,0.5); }
    .tele-slip { color: #80e0ff; }
    .tele-load { color: #ffe080; }

    /* Live Physics Log Box — top right below gear */
    #debug-log-panel {
      position: absolute;
      top: 96px;
      right: 28px;
      width: 250px;
      background: rgba(10,12,20,0.85);
      border: 1px solid rgba(100,200,255,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 10px;
      line-height: 1.6;
      color: #60a5fa;
      backdrop-filter: blur(8px);
    }
    #debug-log-panel .log-title {
      font-size: 9px;
      letter-spacing: 2px;
      color: #93c5fd;
      margin-bottom: 5px;
      border-bottom: 1px solid rgba(147,197,253,0.2);
      padding-bottom: 3px;
    }

    /* Controls hint — top left */
    #controls-hint {
      position: absolute;
      top: 24px;
      left: 28px;
      background: rgba(15,20,35,0.75);
      border: 1px solid rgba(120,160,255,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 10px;
      line-height: 1.8;
      color: rgba(180,200,255,0.7);
      backdrop-filter: blur(8px);
    }
    #controls-hint kbd {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 9px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="error-overlay"></div>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <!-- Speed -->
    <div id="speed-panel">
      <div id="speed-value">0</div>
      <div id="speed-unit">KM / H</div>
    </div>

    <!-- Gear -->
    <div id="gear-panel">
      <div id="gear-label">GEAR</div>
      <div id="gear-value">1</div>
    </div>

    <!-- Live Physics Debug Telemetry Log -->
    <div id="debug-log-panel">
      <div class="log-title">PHYSICS LIVE DEBUG LOG</div>
      <div id="debug-body-y">Body Y: 0.00 m</div>
      <div id="debug-accel">Acc (X/Y/Z): 0 / 0 / 0</div>
      <div id="debug-roll">Roll / Pitch: 0° / 0°</div>
      <div id="debug-fx">Fx Total: 0 N</div>
      <div id="debug-fy">Fy Total: 0 N</div>
      <div id="debug-fz">Fz Total: 0 N</div>
    </div>

    <!-- RPM -->
    <div id="rpm-panel">
      <div id="rpm-label">RPM</div>
      <div id="rpm-bar-bg"><div id="rpm-bar-fill"></div></div>
      <div id="rpm-value">0 RPM</div>
    </div>

    <!-- Inputs -->
    <div id="inputs-panel">
      <div class="input-row">
        <div class="input-label">THROTTLE</div>
        <div class="input-bar-bg"><div id="throttle-fill"></div></div>
      </div>
      <div class="input-row">
        <div class="input-label">BRAKE</div>
        <div class="input-bar-bg"><div id="brake-fill"></div></div>
      </div>
      <div class="input-row">
        <div class="input-label">STEER</div>
        <div id="steer-wrap"><div id="steer-fill"></div></div>
      </div>
    </div>

    <!-- Tyre telemetry -->
    <div id="tele-panel">
      <div class="tele-header">TYRE LOADS &amp; SLIP</div>
      <div class="tele-wheel" id="tw-fl"><span>FL</span> <span class="tele-load" id="tl-fl">0 N</span> <span class="tele-slip" id="ts-fl">0.0°</span></div>
      <div class="tele-wheel" id="tw-fr"><span>FR</span> <span class="tele-load" id="tl-fr">0 N</span> <span class="tele-slip" id="ts-fr">0.0°</span></div>
      <div class="tele-wheel" id="tw-rl"><span>RL</span> <span class="tele-load" id="tl-rl">0 N</span> <span class="tele-slip" id="ts-rl">0.0°</span></div>
      <div class="tele-wheel" id="tw-rr"><span>RR</span> <span class="tele-load" id="tl-rr">0 N</span> <span class="tele-slip" id="ts-rr">0.0°</span></div>
    </div>

    <!-- Controls hint -->
    <div id="controls-hint">
      <kbd>W</kbd> Throttle &nbsp; <kbd>S</kbd> Brake<br>
      <kbd>A</kbd><kbd>D</kbd> Steer &nbsp; <kbd>R</kbd> Reset
    </div>
  </div>

  <script>
    function showError(msg) {
      const el = document.getElementById('error-overlay');
      if (el) {
        el.style.display = 'block';
        el.textContent += msg + '\n\n';
      }
    }
    window.onerror = function(message, source, lineno, colno, error) {
      showError(`[JS Error] ${message}\nAt ${source}:${lineno}:${colno}`);
    };
    window.onunhandledrejection = function(event) {
      showError(`[Promise Rejection] ${event.reason?.stack || event.reason}`);
    };
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
